name: CI

on:
  push:

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@secret-server#latest
        id: secrets

      # This fork exists to carry the cosmo files, so the cosmo build is the check.
      - uses: wow-look-at-my/go-toolchain@v1
        with:
          autorelease: 'false'
